[package]
name = "binance-momentum"
version = "0.1.0"
edition = "2021"
authors = ["Manus AI"]
description = "Spot momentum trading system for Binance with safety-first Testnet operation"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1"
thiserror = "1"
tokio-retry = "0.3"
dashmap = "5"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
futures-util = "0.3"
config = "0.14"

[dev-dependencies]
tempfile = "3"
